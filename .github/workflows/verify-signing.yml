name: Verify signing with rcodesign
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch a real IPA and rcodesign
        run: |
          curl -fsSL -o /tmp/SideStore.ipa https://github.com/SideStore/SideStore/releases/download/nightly/SideStore.ipa
          curl -fsSL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
      - name: Sign it with the app's own signer
        run: |
          set +e
          SAMPLE_IPA=/tmp/SideStore.ipa SIGNED_OUT=$PWD/signing/build/real-ipa ./gradlew :signing:cleanTestDebugUnitTest :signing:testDebugUnitTest --tests '*RealIpaSigningCheck*' --stacktrace > /tmp/gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            { grep -n -A8 "What went wrong\|^e: \|FAILED\|Exception\|error:" /tmp/gradle.log | head -c 5000; echo; echo "--- test report"; grep -h -m12 -A6 "<failure\|Exception" signing/build/test-results/*/*RealIpa*.xml 2>/dev/null | head -c 4000; } > /tmp/fail.txt
            python3 - <<'PY'
          t = open("/tmp/fail.txt", errors="replace").read()
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=signing-step-failed::" + t)
          PY
          fi
          exit $code
      - name: Check every binary with rcodesign
        run: |
          RC=/tmp/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign
          APP=$(echo signing/build/real-ipa/tree/Payload/*.app)
          i=0
          for b in "$APP/SideStore" "$APP/PlugIns/AltWidgetExtension.appex/AltWidgetExtension" "$APP/Frameworks/OpenSSL.framework/OpenSSL"; do
            i=$((i+1))
            { echo "=== verify $b"; $RC verify "$b" 2>&1 || true; echo "=== info"; $RC print-signature-info "$b" 2>&1 | head -120; } > /tmp/report-$i.txt
            python3 - "$i" <<'PY'
          import sys
          t = open(f"/tmp/report-{sys.argv[1]}.txt", errors="replace").read()[:30000]
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=rcodesign-{sys.argv[1]}::{t}")
          PY
          done
      - name: Inspect the signature structure in detail
        run: |
          RC=/tmp/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign
          APP=$(echo signing/build/real-ipa/tree/Payload/*.app)
          B="$APP/Frameworks/OpenSSL.framework/OpenSSL"
          {
            echo "=== superblob"; $RC extract superblob "$B" 2>&1 | head -40
            echo "=== load commands (signature related)"; $RC extract macho-load-commands "$B" 2>&1 | grep -i -B1 -A3 "signature\|linkedit" | head -30
            echo "=== linkedit"; $RC extract linkedit-info "$B" 2>&1 | head -20
            $RC extract cms-raw "$B" > /tmp/cms.der 2>/tmp/cms.err; echo "cms-raw bytes: $(stat -c%s /tmp/cms.der)"; head -c 400 /tmp/cms.err
            $RC extract code-directory-raw "$B" > /tmp/cd.bin 2>/dev/null; echo "cd bytes: $(stat -c%s /tmp/cd.bin)"
            echo "=== asn1parse"; openssl asn1parse -inform DER -in /tmp/cms.der -i 2>&1 | head -70
            echo "=== openssl verify"; openssl cms -verify -inform DER -in /tmp/cms.der -content /tmp/cd.bin -binary -noverify -out /dev/null 2>&1 | head -10
          } > /tmp/deep.txt 2>&1
          python3 - <<'PY'
          t = open("/tmp/deep.txt", errors="replace").read()[:40000]
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=deep-cms::" + t)
          PY
