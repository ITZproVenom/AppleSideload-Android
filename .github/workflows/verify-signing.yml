name: Verify signing with rcodesign
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch a real IPA and rcodesign
        run: |
          curl -fsSL -o /tmp/SideStore.ipa https://github.com/SideStore/SideStore/releases/download/nightly/SideStore.ipa
          curl -fsSL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
      - name: Sign it with the app's own signer
        run: SAMPLE_IPA=/tmp/SideStore.ipa SIGNED_OUT=$PWD/signing/build/real-ipa ./gradlew :signing:test --tests '*RealIpaSigningCheck*' --stacktrace
      - name: Check every binary with rcodesign
        run: |
          RC=/tmp/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign
          APP=$(echo signing/build/real-ipa/tree/Payload/*.app)
          i=0
          for b in "$APP/SideStore" "$APP/PlugIns/AltWidgetExtension.appex/AltWidgetExtension" "$APP/Frameworks/OpenSSL.framework/OpenSSL"; do
            i=$((i+1))
            { echo "=== verify $b"; $RC verify "$b" 2>&1 || true; echo "=== info"; $RC print-signature-info "$b" 2>&1 | head -120; } > /tmp/report-$i.txt
            python3 - "$i" <<'PY'
          import sys
          t = open(f"/tmp/report-{sys.argv[1]}.txt", errors="replace").read()[:30000]
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=rcodesign-{sys.argv[1]}::{t}")
          PY
          done
