name: Android APK
on:
  push:
    branches: [main]
    # Documentation alone does not make a release.
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew assembleRelease test --stacktrace 2>&1 | tee gradle-output.log
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            gradle-output.log
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
      - name: Summarize Gradle failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          import os
          lines = Path('gradle-output.log').read_text(errors='replace').splitlines() if Path('gradle-output.log').exists() else []
          needles = ('FAILURE:', 'What went wrong:', 'Execution failed', 'Unresolved reference', 'e: ', 'failed with an exception', 'AssertionFailedError', 'There were failing tests')
          picked = [line.strip() for line in lines if any(needle in line for needle in needles)]
          for report in Path('.').glob('**/build/test-results/**/*.xml'):
              try:
                  root = ElementTree.parse(report).getroot()
                  for case in root.iter('testcase'):
                      failure = case.find('failure') or case.find('error')
                      if failure is not None:
                          picked.append(f"{case.get('classname')}.{case.get('name')}: {failure.get('message', '')} {(failure.text or '').strip()}")
              except Exception as error:
                  picked.append(f"Could not parse {report}: {error}")
          summary = '\n'.join(picked[-25:]) or 'Gradle failed; see build-diagnostics artifact.'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Gradle failure details\n\n```text\n' + summary + '\n```\n')
          for line in picked[-10:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots
          if-no-files-found: ignore
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          else
            echo "::warning::No SIGNING_KEYSTORE_B64 secret; signing with a one-off key. Updates will need an uninstall first."
            KEYSTORE_PASS=ci-temporary KEY_ALIAS=ci
            keytool -genkeypair -keystore release.jks -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AppleSideload CI"
          fi
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASS" --ks-key-alias "$KEY_ALIAS" --out AppleSideload.apk aligned.apk
          "$BT/apksigner" verify AppleSideload.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppleSideload-apk
          path: AppleSideload.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          # The Unreleased section of CHANGELOG.md, when there is one, is the release notes.
          awk '/^## /{ if (found) exit; if ($0 ~ /^## Unreleased/) { found = 1; next } } found' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Automated build of ${GITHUB_SHA::7}." > notes.md
          printf '\nBuilt from %s. Not fully tested on hardware; see the README for limitations.\n' "${GITHUB_SHA::7}" >> notes.md
          gh release create "$TAG" AppleSideload.apk --title "AppleSideload build ${{ github.run_number }}" --notes-file notes.md --latest
